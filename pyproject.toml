[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecup-quality-research"
version = "0.1.0"
description = "Reproducible research for E-CUP 2026 product-card quality classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.5.1",
  "numpy==2.2.6",
  "pandas==2.3.1",
  "scikit-learn==1.7.2",
  "scipy==1.16.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]
vlm = ["torch>=2.6", "transformers>=4.55", "peft==0.20.0", "pillow>=11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
