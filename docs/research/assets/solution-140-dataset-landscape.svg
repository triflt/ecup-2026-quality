<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Структура данных E-CUP Quality</title>
  <desc id="desc">В наборе 12 971 карточка. В категории БАД 5 564 положительных и 1 905 отрицательных примеров. В категории Легковоспламеняющиеся 198 положительных и 5 304 отрицательных примера. Semantic-family validation содержит 9 853 связанных компонента, 1 853 строки sealed holdout и 8 210 singleton-компонентов.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#172554" flood-opacity="0.10"/>
    </filter>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .muted { fill: #5f6b7a; }
      .small { font-size: 16px; }
      .label { font-size: 20px; font-weight: 700; }
      .value { font-size: 31px; font-weight: 800; letter-spacing: -0.5px; }
      .stat { font-size: 34px; font-weight: 850; letter-spacing: -1px; }
      @media (prefers-color-scheme: dark) {
        .text { fill: #e5e7eb; }
        .muted { fill: #aab4c3; }
      }
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="160" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="70" cy="620" r="180" fill="#14b8a6" opacity="0.08"/>

  <text class="text" x="64" y="72" font-size="34" font-weight="850">Данные диктуют архитектуру</text>
  <text class="text muted" x="64" y="105" font-size="17">Две категории имеют почти зеркальный дисбаланс — одной общей границы решения недостаточно.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="145" width="1072" height="265" rx="22" fill="#ffffff"/>
  </g>

  <text class="text label" x="96" y="202">БАД</text>
  <text class="text muted small" x="96" y="227">7 469 карточек</text>
  <rect x="330" y="179" width="742" height="58" rx="14" fill="#e9edf3"/>
  <path d="M344 179 H518 V237 H344 Q330 237 330 223 V193 Q330 179 344 179Z" fill="#ef6a73"/>
  <path d="M518 179 H1058 Q1072 179 1072 193 V223 Q1072 237 1058 237 H518Z" fill="#2bb6a8"/>
  <text x="358" y="215" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="750" fill="#ffffff">бан · 1 905</text>
  <text x="775" y="215" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="750" fill="#ffffff">не бан · 5 564</text>
  <text class="text muted small" x="1085" y="215" text-anchor="end">74.5% подтверждены</text>

  <text class="text label" x="96" y="304">Легковоспламеняющиеся</text>
  <text class="text muted small" x="96" y="329">5 502 карточки</text>
  <rect x="330" y="281" width="742" height="58" rx="14" fill="#e9edf3"/>
  <path d="M344 281 H1045 V339 H344 Q330 339 330 325 V295 Q330 281 344 281Z" fill="#ef6a73"/>
  <path d="M1045 281 H1058 Q1072 281 1072 295 V325 Q1072 339 1058 339 H1045Z" fill="#2bb6a8"/>
  <text x="625" y="317" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="750" fill="#ffffff">бан · 5 304</text>
  <line x1="1054" y1="275" x2="1054" y2="253" stroke="#2bb6a8" stroke-width="2"/>
  <text class="text" x="1054" y="247" font-size="15" font-weight="750" text-anchor="end">не бан · 198 (3.6%)</text>

  <g>
    <rect x="64" y="448" width="245" height="150" rx="20" fill="#172554"/>
    <text x="88" y="489" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#c7d2fe">ВСЕГО СТРОК</text>
    <text x="88" y="540" font-family="Inter,system-ui,sans-serif" font-size="38" font-weight="850" fill="#ffffff">12 971</text>
    <text x="88" y="571" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#c7d2fe">5 сбалансированных folds</text>
  </g>
  <g>
    <rect x="326" y="448" width="245" height="150" rx="20" fill="#ffffff" stroke="#d9deea"/>
    <text class="text muted" x="350" y="489" font-size="15">SEMANTIC COMPONENTS</text>
    <text class="text stat" x="350" y="540">9 853</text>
    <text class="text muted" x="350" y="571" font-size="15">связанные товары не текут</text>
  </g>
  <g>
    <rect x="588" y="448" width="245" height="150" rx="20" fill="#ffffff" stroke="#d9deea"/>
    <text class="text muted" x="612" y="489" font-size="15">SEALED HOLDOUT</text>
    <text class="text stat" x="612" y="540">1 853</text>
    <text class="text muted" x="612" y="571" font-size="15">не участвует в подборе</text>
  </g>
  <g>
    <rect x="850" y="448" width="286" height="150" rx="20" fill="#ffffff" stroke="#d9deea"/>
    <text class="text muted" x="874" y="489" font-size="15">SINGLETON FAMILIES</text>
    <text class="text stat" x="874" y="540">8 210</text>
    <text class="text muted" x="874" y="571" font-size="15">тест переноса, а не памяти</text>
  </g>

  <g transform="translate(870 110)">
    <circle cx="0" cy="0" r="6" fill="#ef6a73"/>
    <text class="text muted" x="14" y="5" font-size="14">label 0 · бан</text>
    <circle cx="130" cy="0" r="6" fill="#2bb6a8"/>
    <text class="text muted" x="144" y="5" font-size="14">label 1 · не бан</text>
  </g>
</svg>
