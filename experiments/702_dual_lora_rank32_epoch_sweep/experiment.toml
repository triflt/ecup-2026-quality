[experiment]
id = "702"
slug = "dual_lora_rank32_epoch_sweep"
title = "Solution140 doubled-capacity LoRA epoch sweep"
status = "queued_screen"
entrypoint = "experiments/702_dual_lora_rank32_epoch_sweep/launch_remote_compute.sh"
result_file = "experiments/702_dual_lora_rank32_epoch_sweep/results/metrics.json"

[data]
version = "competition_train_v1"
registry = "datasets/registry.toml"

[validation]
primary_version = "grouped_text_v1"
registry = "validation/registry.toml"
folds = "validation/grouped_text_v1/folds.csv"
primary_metric = "macro_f1"

[hypothesis]
parent_experiment = "701"
changed_factor = "rsLoRA rank 16 to 32 and alpha 32 to 64 at constant alpha/r"
mechanism = "greater adapter capacity may fit the rare category boundary that rank16 underfits"
expected_macro_f1_delta = 0.003
falsification = "rank32 does not beat matched rank16 epoch in frozen end-to-end replay"
precedents = ["paired LoRA capacity scaling at constant alpha/r"]

[budget]
planned_gpu_hours = 16.0
planned_public_submissions = 0
runtime_limit_minutes = 360

[execution]
arguments = ["fold0", "qwen35_4b,qwen3vl_2b", "epochs=1,2,3,4,5", "r32_alpha64"]

[artifacts]
directory = "artifacts"
publish = false

