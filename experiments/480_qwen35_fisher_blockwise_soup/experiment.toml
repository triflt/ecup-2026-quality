[experiment]
id = "480"
slug = "qwen35_fisher_blockwise_soup"
title = "Train-only blockwise Fisher merge of original and flammable Qwen3.5 adapters"
status = "prepared"
entrypoint = "research/qwen35_fisher_blockwise_soup_oof.py"
result_file = "experiments/480_qwen35_fisher_blockwise_soup/results/metrics.json"

[data]
version = "competition_train_v1"
registry = "datasets/registry.toml"

[validation]
primary_version = "qwen35_fisher_blockwise_soup_screen_v1"
selection_guard = "connected_family_guard_v2"
folds = "validation/grouped_text_v1/folds.csv"
primary_metric = "macro_f1"

[hypothesis]
parent_experiment = "470_qwen35_adapter_soup_seed_repeat"
changed_factor = "Replace one global alpha-0.50 with train-only blockwise Fisher coefficients"
mechanism = "Preserve broad-recall blocks near the original adapter and import specialist-sensitive flammable blocks more strongly"
expected_macro_f1_delta = 0.002
falsification = "Reject if either fold is non-positive, mean delta is below 0.001, errors worsen, or coefficients are not selective and stable"

[selection]
seed = 31415
folds = [0, 3]
lambda_specialist = 1.0
alpha_clip = [0.10, 0.90]
weights = [0.15, 0.10, 0.75]
threshold_source = "experiments/430_qwen35_flammable_adapter_soup/results/acceptance_audit.json"
holdout_tuning = false

[acceptance]
required_positive_folds = 2
required_mean_macro_delta = 0.001
max_false_negative_increase = 0
require_corrected_gt_regressed = true
min_selective_block_fraction = 0.25
min_cross_fold_alpha_rank_correlation = 0.50

[budget]
planned_gpu_hours = 4.0
planned_public_submissions = 0
runtime_limit_minutes_per_fold = 210

[execution]
jobs = []
hardware = "two independent one-H100 jobs"
result = "prepared before predictions"

[artifacts]
directory = "artifacts"
publish = false
