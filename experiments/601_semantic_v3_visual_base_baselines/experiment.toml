outer_protocol = "fit on four development folds, evaluate fifth"
selector_protocol = "four-head weights and threshold selected only from inner OOF on outer training folds"
inner_text_protocol = "fit vocabulary and IDF on each inner-train only; transform inner-validation"
projection_protocol = "empirical CDF of inner-OOF raw scores"
