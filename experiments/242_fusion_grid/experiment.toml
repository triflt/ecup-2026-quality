[experiment]
id = "242"
slug = "fusion_grid"
title = "Fusion Grid over Track A/B scores (Track C, QC)"
status = "prepared"
entrypoint = "experiments/242_fusion_grid/src/run_fusion_grid.py"
result_file = "experiments/242_fusion_grid/results/metrics.json"

[data]
version = "competition_train_v1"
registry = "datasets/registry.toml"

[validation]
primary_version = "grouped_text_v1"
registry = "validation/registry.toml"
folds = "validation/grouped_text_v1/folds.csv"
primary_metric = "macro_f1"
diagnostic_split = "stratified 90/10 by (category,label), seed=42, tmp/QC/split.json"

[hypothesis]
parent_experiment = "040_late_fusion"
changed_factor = "Фьюжн Gemma-LoRA (multi-image) с контрастивным эмбеддером"
mechanism = "Независимые ошибки генеративной и эмбеддинговой веток компенсируются простым взвешиванием"
expected_macro_f1_delta = 0.01
falsification = "Fusion macro-F1 < лучшая одиночная ветка + 0.01 на val"
precedents = ["040_late_fusion", "090_advanced_mixed", "140_dual_lora_fusion"]

[acceptance]
baseline_macro_f1 = 0.3776
required_fold_wins = 4
max_category_f1_drop = 0.005
repeat_required = true

[budget]
planned_gpu_hours = 2.0
planned_public_submissions = 1
runtime_limit_minutes = 40

[execution]
arguments = ["--scores_dir", "tmp/QC/exps"]

[artifacts]
directory = "artifacts"
publish = false
local_artifacts_path = "/home/jovyan/shares/SR008.fs2/litvinov/tmp/QC"
