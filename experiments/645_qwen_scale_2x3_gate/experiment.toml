[experiment]
id = "645"
slug = "qwen_scale_2x3_gate"
title = "Fair Qwen 4B versus 27B prompting, class and evidence gate"
status = "prepared_waiting_for_640_644"
entrypoint = "experiments/645_qwen_scale_2x3_gate/evaluate.py"
result_file = "experiments/645_qwen_scale_2x3_gate/results/metrics.json"

[data]
version = "competition_train_v1"
scope = "semantic_family_v3 development only"
expected_rows = 11118
sealed_rows = 0

[validation]
version = "semantic_family_v3"
screen_folds = [0, 3]
full_folds = [0, 1, 2, 3, 4]
threshold = 0.0
threshold_tuned = false
primary_evidence_order = "evidence_first"
diagnostic_evidence_order = "class_first"
required_full_fold_wins = 4
minimum_macro_delta = 0.003
maximum_category_drop = 0.002
minimum_corrected_to_regressed = 1.5

[evidence_gate]
minimum_format_valid_fraction = 0.95
minimum_grounded_fraction_of_emitted = 0.95
minimum_evidence_coverage = 0.50
manual_audit_rows = 200
minimum_manual_relevance = 0.90
maximum_manual_unsupported = 0.01
minimum_scope_correctness = 0.95
free_coordinates = false

[distillation_gate]
large_teacher = "Qwen/Qwen3.8-27B"
small_student = "Qwen/Qwen3.5-4B"
required_winning_folds = 4
requires_hard_cohort_gain = true
requires_manual_audit = true
public_used = false

[budget]
gpu_jobs = 0
planned_public_submissions = 0

[artifacts]
publish = false
directory = "artifacts"
