[experiment]
id = "695"
slug = "qwen4_hard_anchored_listwise"
status = "prepared_waiting_exp692_routed_acceptance"
job_name_prefix = "qwen4-rank-"

[hypothesis]
parent = "641_qwen35_4b_class_only_lora"
changed_factor = "bounded_within_stratum_teacher_listwise_auxiliary"
mechanism = "Learn teacher order only within equal hard-label flammable strata while retaining full hard BCE."
falsification = "Reject if boundary protection fails, pooled Macro/AP does not improve, or BAD replay is not exact."
precedents = ["ListNet", "hard-anchored ranking distillation"]

[training]
model = "Qwen/Qwen3.5-4B"
folds = [0, 1, 2, 3, 4]
seed = 42
hard_bce_coefficient = 1.0
rank_coefficient = 0.50
loss_formula = "L_hard + 0.5 * L_rank"
rank_scope = "flammable_same_hard_label_only"
hard_bce_scope = "all_categories"
bad_production_replay = "frozen_byte_identical"
teacher_fold_schema = "exp691_fold_report_v1"
teacher_acceptance_schema = "exp692_qwen27_routed_acceptance_v1"
label_policy_slice = "NAME casefold contains both топлив and зажигал; exact 25/25 label=0"

[execution]
gpus = 1
gpu_type = "H100"
jobs = 1
upload_authorized = false
submit_authorized = false
public_authorized = false

[evaluation]
minimum_fold_wins = 4
minimum_pooled_macro_delta = 0.006
minimum_flammable_f1_delta = 0.012
minimum_corrections_regressions_ratio = 1.5
minimum_bootstrap_p_gain = 0.90
singleton_delta = "strictly_positive"
evidence_slice_guard = "regressions_lte_corrections_each_slice"
runtime_limit_source = "explicit_submission_limit_argument"
