changed_factor = "Move exactly one complete unambiguous transaction-scope sentence to the beginning of description for a deterministic row subset nearest to 50 percent of eligible training occurrences"
mechanism = "Training invariance to sentence position may recover late bundle and compatibility evidence without adding deleting or paraphrasing tokens and without changing inference"
expected_macro_f1_delta = "0.001-0.004"
