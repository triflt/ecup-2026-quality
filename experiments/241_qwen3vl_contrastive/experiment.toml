[experiment]
id = "241"
slug = "qwen3vl_contrastive"
title = "Qwen3-VL-Embedding-2B Contrastive (Track B, QC)"
status = "running_ablations"
entrypoint = "experiments/241_qwen3vl_contrastive/src/train_contrastive.py"
result_file = "experiments/241_qwen3vl_contrastive/results/metrics.json"

[data]
version = "competition_train_v1"
registry = "datasets/registry.toml"

[validation]
primary_version = "grouped_text_v1"
registry = "validation/registry.toml"
folds = "validation/grouped_text_v1/folds.csv"
primary_metric = "macro_f1"
diagnostic_split = "stratified 90/10 by (category,label), seed=42, tmp/QC/split.json"

[hypothesis]
parent_experiment = "030_qwen3vl_embedding"
changed_factor = "Контрастивное дообучение эмбеддера (sigmoid/triplet) вместо zero-shot"
mechanism = "Сближение same-label пар должно улучшить линейную разделимость image head для фьюжна"
expected_macro_f1_delta = 0.02
falsification = "Gain embedding-head < +0.01 macro к zero-shot на val"
precedents = ["030_qwen3vl_embedding", "060_multiview_fusion", "040_late_fusion"]

[acceptance]
baseline_macro_f1 = 0.8581
required_fold_wins = 4
max_category_f1_drop = 0.005
repeat_required = true

[budget]
planned_gpu_hours = 8.0
planned_public_submissions = 0
runtime_limit_minutes = 40

[execution]
arguments = ["--loss", "sigmoid|triplet", "--batch_size", "8", "--grad_accum", "4", "--n_images", "2"]

[artifacts]
directory = "artifacts"
publish = false
local_artifacts_path = "/home/jovyan/shares/SR008.fs2/litvinov/tmp/QC/exps"
