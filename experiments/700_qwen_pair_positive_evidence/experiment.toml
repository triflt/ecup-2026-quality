[experiment]
id = "700"
slug = "qwen_pair_positive_evidence"
title = "Asymmetric positive-evidence reranker over frozen Qwen embeddings"
status = "screening"
entrypoint = "experiments/700_qwen_pair_positive_evidence/train_screen.py"
result_file = "experiments/700_qwen_pair_positive_evidence/results/metrics.json"

[data]
version = "competition_train_v1"
registry = "datasets/registry.toml"

[validation]
primary_version = "grouped_text_v1"
registry = "validation/registry.toml"
folds = "frozen_exp699_pair_packet_folds_0_3"
primary_metric = "macro_f1"

[hypothesis]
parent_experiment = "699"
changed_factor = "pair target and asymmetric 0-to-1 evidence residual"
mechanism = "positive donors verify rare flammable false negatives without reopening negative-class transfer"
expected_macro_f1_delta = 0.001
falsification = "zero corrected original FN, more than one new FP, nonpositive net, or no gain over query-only"
precedents = ["retrieval-augmented classification with learned pair verification"]

[acceptance]
baseline_macro_f1 = 0.9568949027529112
required_fold_wins = 1
max_category_f1_drop = 0.0
repeat_required = false

[budget]
planned_gpu_hours = 0.1
planned_public_submissions = 0
runtime_limit_minutes = 10

[execution]
arguments = ["--frozen-pair-packet", "exp699 folds0/3"]

[artifacts]
directory = "artifacts"
publish = false

