[experiment]
id = "643"
slug = "qwen35_4b_grounded_evidence_lora"
title = "Qwen3.5-4B verdict-primary grounded-evidence LoRA"
status = "prepared_not_launched"
entrypoint = "experiments/643_qwen35_4b_grounded_evidence_lora/run_fold.py"
result_file = "experiments/643_qwen35_4b_grounded_evidence_lora/results/metrics.json"

[data]
version = "competition_train_v1"
scope = "semantic_family_v3 development only"
evidence_manifest = "experiment-623 exact text targets plus required checksum-locked OCR shards"
model_inputs = ["category", "name", "description", "first_image"]
ocr_in_prompt = false
sealed_rows = 0

[validation]
version = "semantic_family_v3"
screen_folds = [0, 3]
full_folds_after_screen = [1, 2, 4]
primary_order = "evidence_first"
diagnostic_order = "class_first"
threshold = 0.0
threshold_tuned = false
required_full_fold_wins = 4

[model]
id = "Qwen/Qwen3.5-4B"
revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
objective = "grounded_evidence"

[training]
seed = 42
epochs = 1
micro_batch_size = 4
gradient_accumulation = 4
effective_batch_size = 16
learning_rate = 0.0002
lora_rank = 16
lora_alpha = 32
lora_dropout = 0.05
primary_verdict_weight = 1.0
evidence_auxiliary_weight = 0.05
class_first_auxiliary_share = 0.5
evidence_first_auxiliary_share = 0.5
free_coordinates = false

[hypothesis]
changed_factor = "Add a decoupled low-weight exact-evidence auxiliary objective to experiment 641"
control = "641"
mechanism = "Grounding regularizes representations while a separate atomic verdict loss preserves calibration; verified evidence can also condition a second verdict pass"
falsification = "Reject if either screen fold loses, evidence is not exact, or safety/category gates fail"
precedents = ["Multimodal-CoT 2023", "experiments 520, 570 and 623"]

[budget]
