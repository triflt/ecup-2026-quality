[experiment]
id = "641"
slug = "qwen35_4b_class_only_lora"
title = "Qwen3.5-4B class-only LoRA in the frozen scale grid"
status = "screen_training_running"
entrypoint = "experiments/641_qwen35_4b_class_only_lora/run_fold.py"
result_file = "experiments/641_qwen35_4b_class_only_lora/results/metrics.json"

[data]
version = "competition_train_v1"
scope = "semantic_family_v3 development only"
model_inputs = ["category", "name", "description", "first_image"]
sealed_rows = 0

[validation]
version = "semantic_family_v3"
screen_folds = [0, 3]
full_folds_after_screen = [1, 2, 4]
threshold = 0.0
threshold_tuned = false
required_full_fold_wins = 4

[model]
id = "Qwen/Qwen3.5-4B"
revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
objective = "class_only"

[training]
seed = 42
epochs = 1
micro_batch_size = 4
gradient_accumulation = 4
effective_batch_size = 16
learning_rate = 0.0002
lora_rank = 16
lora_alpha = 32
lora_dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[hypothesis]
changed_factor = "Supervised class-only LoRA relative to fixed 4B prompting"
control = "640/Qwen3.5-4B prompting"
mechanism = "Task adaptation should learn the local policy boundary without changing inputs or evidence supervision"
falsification = "Reject if the frozen screen gates in experiment 645 fail"
precedents = ["Qwen3.5-4B official model card", "experiment 600"]

[budget]
screen_jobs = 2
gpu_per_job = 1
planned_public_submissions = 0

[artifacts]
publish = false
directory = "artifacts"
