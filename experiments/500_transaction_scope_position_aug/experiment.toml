[experiment]
id = "500"
slug = "transaction_scope_position_aug"
title = "Position-only transaction-scope augmentation for the routed Qwen3.5 adapter"
status = "planned_not_run"
entrypoint = "experiments/500_transaction_scope_position_aug/trainer.py"
result_file = "experiments/500_transaction_scope_position_aug/results/metrics.json"

[data]
version = "competition_train_v1"
registry = "datasets/registry.toml"

[validation]
primary_version = "semantic_family_component_nested_v1_pending_freeze"
registry = "validation/registry.toml"
folds = "supplied by the frozen OOF artifact after semantic-family graph audit"
primary_metric = "macro_f1"

[hypothesis]
parent_experiment = "400_qwen35_category_routed_adapters"
training_parent_component = "qwen35_lora_bad_positive_family_seed42_v260"
changed_factor = "Move one whole unambiguous transaction-scope sentence to the front of the description for an independently hash-selected outer-train subset with 50 percent target probability per eligible unique row"
mechanism = "Position invariance should expose late included/excluded/compatible evidence without deleting context, changing labels, or adding an inference component"
falsification = "Reject if either predeclared screen fold is non-positive, flammable or safety false negatives grow, BAD changes, or corrected decisions do not exceed regressions"
precedents = [
  "Consistent text categorization using data augmentation in e-commerce, ACL Industry 2023",
  "Counterfactually augmented data, ICLR 2020",
  "Unsupervised data augmentation, NeurIPS 2020",
]

[augmentation]
version = "exp500_transaction_scope_position_aug_v1"
category = "Легковоспламеняющиеся"
unit = "whole sentence"
eligible_scope_sentences = 1
selection = "SHA-256(namespace, outer fold, row id), first byte below 128"
selection_rate = 0.5
adds_tokens = false
deletes_tokens = false
rephrases_tokens = false
changes_labels = false
changes_multiplicity = false
changes_steps = false
changes_inference = false

[training]
parent_entrypoint = "research/qwen35_bad_family_diverse_positives_lora.py"
training_mode = "hard"
model_class = "multimodal"
family_balance_flammable = false
family_diverse_bad_positives = true
family_diverse_flammable_negatives = false
epochs = 1
batch_size = 4
gradient_accumulation = 4
seed = 42

[acceptance.screen]
folds = [0, 3]
reject_only = true
require_each_routed_delta_positive = true
required_mean_macro_delta = 0.001
max_flammable_false_negative_increase = 0
max_safety_union_false_negative_increase = 0
require_corrected_greater_than_regressed = true
require_bad_byte_identical = true

[acceptance.full]
required_macro_f1_delta = 0.003
required_flammable_f1_delta = 0.006
required_fold_wins = 4
max_flammable_false_negative_increase = 0
max_safety_union_false_negative_increase = 0
min_corrected_to_regressed_ratio = 1.5
required_component_bootstrap_probability = 0.90
required_prior_survival_rate = 0.80
repeat_folds = [0, 3]
repeat_seed = 31415

[budget]
screen_gpu_hours = 2.5
full_cycle_gpu_hours = 7.0
repeat_gpu_hours = 2.5
planned_public_submissions = 0

[execution]
arguments = []

[artifacts]
directory = "artifacts"
publish = false
