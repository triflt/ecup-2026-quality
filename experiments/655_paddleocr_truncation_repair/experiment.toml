decoding = "greedy"
source_max_new_tokens = 512
repair_max_new_tokens = 1536

[hypothesis]
parent_experiment = "633_paddleocr_vl16_spotting"
changed_factor = "Increase generation budget only for rows proven to have truncated source output"
mechanism = "A longer deterministic decode completes coordinate blocks without changing the OCR model or non-truncated rows"
expected_macro_f1_delta = 0.0
falsification = "Reject the overlay if any selected row fails, lacks EOS, keeps a partial coordinate block, changes source identity, or requires classification labels"
precedents = ["PaddleOCR-VL-1.6 structured spotting", "fail-closed weak-label preparation"]

[validation]
integrity_version = "ocr_truncation_repair_v1"
