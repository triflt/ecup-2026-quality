[experiment]
id = "655"
slug = "paddleocr_truncation_repair"
title = "Deterministic repair of truncated PaddleOCR-VL spotting outputs"
status = "rejected_bounded_smoke"
entrypoint = "experiments/655_paddleocr_truncation_repair/run_repair.py"
result_file = "experiments/655_paddleocr_truncation_repair/results/metrics.json"

[data]
version = "competition_train_v1"
source_experiment = "633_paddleocr_vl16_spotting"
